# Portable worker = the Discord bridge + the Smithers control plane it spawns,
# shipped as a prebuilt multi-arch image (arm64 + amd64) on GHCR. Deploy on ANY
# host with Docker: `docker login ghcr.io` (once), drop in .env, then
#   docker compose pull && docker compose up -d
# No source or build needed on the host — same command on a Mac Mini or a VPS.
#
# Runs as the non-root `bun` user (uid 1000). The ./outputs bind mount must be
# writable by uid 1000 — create it first: `mkdir -p outputs && sudo chown 1000:1000 outputs`.
#
# To rebuild/publish a new version (on a machine with the source + buildx):
#   docker buildx build --platform linux/amd64,linux/arm64 \
#     -t ghcr.io/boiledrenkon/pillmaker:latest --push .
services:
  worker:
    image: ghcr.io/boiledrenkon/pillmaker:latest
    env_file: .env
    environment:
      PROJECT_ROOT: /app
      BOT_DB: /app/data/state.db
    restart: unless-stopped
    volumes:
      - ./outputs:/app/outputs   # generated images persist to the host
      # Both durable DBs live here: the bridge's state.db AND smithers.db
      # (symlinked into /app/data by the Dockerfile) — so runs paused at a QC
      # gate survive container restarts.
      - worker-data:/app/data

volumes:
  worker-data:
